<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>班級秩序能量站</title>
<style>
:root{
  --bg:#f5f1e8; --ink:#1f2a44; --muted:#6b7280; --card:#ffffff; --line:#e7e1d4;
  --c1:#fde68a; --c2:#fdba74; --c3:#ef4444; --c4:#6d28d9;
  --ok:#10b981; --accent:#f59e0b;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Heiti TC",system-ui,sans-serif;font-size:16px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}

/* top bar */
#topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:19px;letter-spacing:1px;margin-right:6px}
#classSel{padding:6px 10px;border-radius:8px;border:0;font-size:16px;font-weight:700}
#timer{font-variant-numeric:tabular-nums;font-size:15px;opacity:.9;min-width:120px}
.tbtn{border:0;border-radius:9px;padding:8px 14px;font-size:15px;font-weight:700;background:#33415f;color:#fff}
.tbtn:hover{background:#40507a}
.tbtn.go{background:var(--ok)}
.tbtn.stop{background:#e11d48}
nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:0;background:transparent;color:#cbd5e1;padding:8px 12px;border-radius:9px;font-size:15px;font-weight:700}
nav button.on{background:#fff;color:var(--ink)}

/* energy */
#energy{padding:14px 18px 4px}
.ebar-wrap{display:flex;align-items:center;gap:14px}
.elabel{font-weight:800;white-space:nowrap}
.ebar{flex:1;height:30px;background:#e5dfd1;border-radius:20px;overflow:hidden;position:relative;box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.efill{height:100%;background:linear-gradient(90deg,#34d399,#10b981 60%,#059669);border-radius:20px;transition:width .8s cubic-bezier(.3,1.4,.5,1)}
.ebar.full .efill{background:linear-gradient(90deg,#fbbf24,#f59e0b,#f97316);animation:glow 1.2s infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.25)}}
.etext{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#1f2a44;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.ereward{font-size:14px;color:var(--muted);white-space:nowrap}

/* class view */
main{padding:12px 18px 40px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.gcard{background:var(--card);border-radius:16px;padding:12px;border:2px solid var(--line);transition:transform .3s, box-shadow .3s}
.gcard.win{animation:win 1.6s ease}
@keyframes win{0%{transform:scale(1)}20%{transform:scale(1.04);box-shadow:0 0 0 6px #fde68a}100%{transform:scale(1);box-shadow:none}}
.ghead{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;margin-bottom:10px}
.gpts{background:#fef3c7;color:#92400e;border-radius:20px;padding:3px 12px;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.tile{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 6px 7px;text-align:center;color:var(--ink);transition:background .25s, transform .12s;user-select:none;-webkit-tap-highlight-color:transparent}
.tile:active{transform:scale(.95)}
.tile .no{font-size:22px;font-weight:900;line-height:1.1}
.tile .nm{font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;justify-content:center;gap:4px;margin-top:5px;height:10px}
.dot{width:9px;height:9px;border-radius:50%;background:#e5e7eb}
.dot.f{background:#1f2a44}
.tile.c1{background:var(--c1);border-color:#f5d565}
.tile.c2{background:var(--c2);border-color:#f59e5b}
.tile.c3{background:var(--c3);border-color:#dc2626;color:#fff}
.tile.c3 .dot.f,.tile.c4 .dot.f{background:#fff}
.tile.c3 .dot,.tile.c4 .dot{background:rgba(255,255,255,.3)}
.tile.c4{background:var(--c4);border-color:#5b21b6;color:#fff}
.tile.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.12)}}
.hint{margin-top:16px;color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.legend{display:flex;gap:8px;align-items:center}
.lg{width:16px;height:16px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.1)}
#kbuf{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;font-size:42px;font-weight:900;padding:8px 22px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:30}
.empty{background:#fff;border-radius:16px;padding:40px;text-align:center;font-size:18px;color:var(--muted)}
.notice{background:#fff7e6;border:1px solid #fcd34d;border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}

/* panels */
.panel{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:16px;border:1px solid var(--line)}
.panel h2{margin:0 0 12px;font-size:19px}
.panel h3{margin:16px 0 8px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:8px 0}
.btn{border:1px solid #d6cfbf;background:#faf8f3;border-radius:9px;padding:7px 13px;font-size:15px;font-weight:700;color:var(--ink)}
.btn:hover{background:#f1ece0}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:#be123c;border-color:#fecdd3;background:#fff1f2}
.btn.sm{padding:4px 9px;font-size:13px}
input[type=text],input[type=number],textarea,select.inp{border:1px solid #d6cfbf;border-radius:8px;padding:6px 9px;background:#fff}
input[type=number]{width:80px}
textarea{width:100%;min-height:150px;font-size:15px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);border-radius:20px;padding:5px 14px;font-weight:700;background:#fff}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid #eee;padding:6px 8px;text-align:center}
th{background:#faf7f0;position:sticky;top:0}
td.l,th.l{text-align:left}
td.hot{background:#ede9fe;color:#5b21b6;font-weight:800}
td.warm{background:#fef3c7}
.tblwrap{overflow:auto;max-height:65vh;border:1px solid #eee;border-radius:10px}
.thumb{width:44px;height:44px;border-radius:50%;object-fit:cover;vertical-align:middle;background:#eee}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,#c7d2fe,#a5b4fc);color:#1e1b4b;font-weight:900}
.small{font-size:13px;color:var(--muted)}
label.file{display:inline-block}
label.file input{display:none}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px 24px}
.setgrid label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #eee}
.setgrid label.wide{grid-column:1/-1}
.setgrid label.wide input{flex:1}

/* overlay */
#overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#overlay.show{display:flex}
.modal{background:#fff;border-radius:22px;padding:26px 30px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.3,1.5,.5,1);max-height:92vh;overflow:auto}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{margin:4px 0 14px;font-size:24px}
.modal .acts{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.modal.limit{max-width:440px;border:6px solid var(--c4)}
.bigphoto{width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid #ede9fe}
.limit .who{font-size:30px;font-weight:900;margin-top:12px}
.limit .msg{font-size:24px;margin-top:10px;color:#4c1d95;font-weight:700}
.modal.stars{max-width:960px;background:linear-gradient(180deg,#fffbeb,#fff)}
.modal.stars h2{font-size:32px}
.starwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px;margin-top:10px}
.star{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .4s backwards}
.star img,.star .av{width:96px;height:96px;border-radius:50%;object-fit:cover;border:4px solid #fcd34d;font-size:30px}
.star .nm{font-weight:800}
.modal.party{background:linear-gradient(135deg,#fef3c7,#fde68a);max-width:560px}
.party .big{font-size:64px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;font-size:16px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.mapbox{position:relative;width:100%;overflow:hidden}
.map{position:absolute;top:0;width:1920px;height:1080px;transform-origin:0 0;background:#fff3e2;border-radius:24px}
.board{position:absolute;left:273px;top:22px;width:1408px;height:40px;background:#00c060;border-radius:20px;color:#fff;font-weight:900;font-size:26px;display:flex;align-items:center;justify-content:center;letter-spacing:8px}
.piano{position:absolute;left:676px;top:80px;width:154px;height:60px;background:#000;color:#fff;border-radius:30px;font-weight:900;font-size:24px;display:flex;align-items:center;justify-content:center;letter-spacing:4px}
.gcirc{position:absolute;width:190px;height:190px;border-radius:50%;border:8px solid #fff;display:flex;align-items:center;justify-content:center}
.gcirc .gnum{font-size:118px;font-weight:900;color:#fff;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.08)}
.gcirc .gstar{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);background:#fff;border:4px solid #1f2a44;border-radius:30px;padding:2px 18px;font-size:32px;font-weight:900;white-space:nowrap;color:#1f2a44}
.gcirc.win{animation:cwin 1.6s ease}
@keyframes cwin{0%,100%{transform:scale(1)}25%{transform:scale(1.15);box-shadow:0 0 0 16px #fde68a}}
.seat{position:absolute;border:7px solid #111;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;color:#111;overflow:hidden;transition:transform .12s,box-shadow .25s;-webkit-tap-highlight-color:transparent;font-family:inherit}
.seat:active{transform:scale(.96)}
.seat .sn{font-size:30px;font-weight:900;line-height:1}
.seat .cam{font-size:18px;line-height:1;margin-top:2px}
.seat .sm{font-size:22px;font-weight:800;line-height:1.05;white-space:nowrap;max-width:100%;overflow:hidden}
.seat.v .sm{writing-mode:vertical-rl;letter-spacing:1px;margin:4px 0 3px;max-height:118px}
.seat.v .sn{font-size:34px}
.seat .line{display:flex;align-items:baseline;gap:8px}
.seat .dots{display:flex;height:14px;gap:6px;margin-top:4px}
.seat .dot{width:13px;height:13px;border-radius:50%;background:rgba(0,0,0,.15)}
.seat.l1{border-color:#f59e0b;box-shadow:0 0 0 6px #fde68a}
.seat.l1 .dot.f{background:#d97706}
.seat.l2{border-color:#f97316;box-shadow:0 0 0 8px #fdba74}
.seat.l2 .dot.f{background:#ea580c}
.seat.l3{border-color:#dc2626;box-shadow:0 0 0 10px #fca5a5;animation:pulse 1.2s infinite}
.seat.l3 .dot.f{background:#dc2626}
@keyframes pulse{50%{box-shadow:0 0 0 16px rgba(252,165,165,.45)}}
.seat.l4{background:#4c1d95!important;color:#fff;border-color:#2e1065}
.seat.l4 .dot.f{background:#fff}
.seat.l4 .dot{background:rgba(255,255,255,.3)}
.seat.empty{opacity:.4}
.seat.sel{outline:8px dashed #1f2a44;outline-offset:5px;z-index:2}
.seat.bump{animation:bump .35s}
.unseated{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fl{display:block}
.fruit{position:absolute;width:40px;height:40px;z-index:1;pointer-events:none}
.fruit.new{animation:grow 1s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes grow{from{transform:scale(0)}}
.fruit.fall{z-index:3;animation:fall 1.5s ease-in forwards}
@keyframes fall{0%{transform:translateY(0) rotate(0)}15%{transform:translateY(-12px) rotate(-10deg)}80%{opacity:1}100%{transform:translateY(var(--dy)) rotate(60deg);opacity:0}}
.treelabel{position:absolute;left:880px;top:546px;width:240px;height:38px;border-radius:19px;background:#fff;border:4px solid #1f2a44;font-size:24px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#1f2a44}
.treelabel.full{background:#fde68a;animation:glow 1.2s infinite alternate}
.drop{font-size:20px;margin-top:10px;color:#b91c1c;font-weight:800}
.classsign{position:absolute;left:1045px;top:438px;width:210px;height:82px;background:#c98a4b;border:6px solid #6b3f1d;border-radius:14px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;text-shadow:0 2px 0 rgba(0,0,0,.25);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12);z-index:1}
.signpost{position:absolute;left:1140px;top:500px;width:20px;height:48px;background:#6b3f1d;border-radius:4px}
#view-farm{padding:0}
.farm{min-height:calc(100vh - 60px);background:linear-gradient(180deg,#bfe6ff 0,#e3f4ff 150px,#b7e07a 150px,#9fd35f 100%);padding:24px 20px 40px;position:relative}
.farm h2{margin:0 0 6px;text-align:center;font-size:30px;color:#1f2a44}
.farm .sub{text-align:center;color:#334155;margin-bottom:56px}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:30px 20px}
.plot{background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;cursor:pointer;color:#1f2a44;transition:transform .15s}
.plot:hover{transform:translateY(-4px)}
.plot svg{width:100%;max-width:290px;height:auto;overflow:visible}
.plot .info{margin-top:6px;background:rgba(255,255,255,.9);border-radius:14px;padding:6px 14px;font-weight:800;font-size:16px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.plot .info .small{font-weight:600}
.plot.cur .info{outline:3px solid #1f2a44}
.plot.ripe svg{filter:drop-shadow(0 0 12px #fde047)}
#printArea{display:none}
.pp{break-after:page;page-break-after:always}
.pp:last-child{break-after:auto;page-break-after:auto}
.ptitle{font-size:26px;font-weight:900;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline;color:#111}
.ptitle span{font-size:15px;font-weight:600;color:#555}
.pwrap{width:1037px;height:584px;position:relative;overflow:hidden}
.pmap{position:absolute;left:0;top:0;width:1920px;height:1080px;transform:scale(.54);transform-origin:0 0;border:3px solid #ccc;border-radius:24px;background:#fff}
.pseat{position:absolute;border:7px solid #111;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;color:#111}
.pseat.h{flex-direction:row;gap:12px}
.pseat .sn{font-size:38px;font-weight:900;line-height:1}
.pseat .sm{font-weight:800;line-height:1.05;white-space:nowrap}
.pseat.v .sm{writing-mode:vertical-rl;margin-top:6px;letter-spacing:2px}
@page slip{size:A4 portrait;margin:8mm}
@media print{
  @page{size:A4 landscape;margin:8mm}
  .slpage{page:slip}
  .ntprev .slip{transform:none}
  html,body{background:#fff!important;height:auto}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
.shopwrap{max-width:1100px;margin:0 auto}
.barn{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#fef3c7,#fde68a);border:3px solid #d97706;border-radius:20px;padding:18px 24px;margin-bottom:18px;flex-wrap:wrap}
.barn .big{font-size:64px;font-weight:900;color:#92400e;line-height:1}
.barn .bk{font-size:34px;letter-spacing:2px;flex:1;min-width:200px;word-break:break-all}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.item{background:#fff;border:2px solid var(--line);border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px}
.item .ic{font-size:44px}
.item .nm{font-size:18px;font-weight:800;flex:1}
.item .cost{font-weight:900;color:#b45309;font-size:17px}
.item.cant{opacity:.55}
.hist li{margin:4px 0}
.rsticker{position:absolute;z-index:4;background:#fff;border:3px solid #1f2a44;border-radius:22px;padding:1px 6px;font-size:26px;line-height:1.15;pointer-events:none;box-shadow:0 2px 0 rgba(0,0,0,.15);white-space:nowrap}
.badges{position:absolute;top:1px;right:3px;font-size:22px;line-height:1;display:flex;gap:1px;pointer-events:none;filter:drop-shadow(0 1px 0 #fff)}
.pseat{position:absolute}
.pseat .badges{font-size:24px}
.rlegend{position:absolute;color:#1f2a44;font-family:inherit}
.rlegend.big{width:180px;background:#fff;border:4px solid #1f2a44;border-radius:16px;padding:8px 12px;font-size:21px;font-weight:800;line-height:1.55}
.rlegend.big[data-lg]{cursor:pointer;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.rlegend .rlt{font-size:22px;text-align:center;border-bottom:2px dashed #cbd5e1;margin-bottom:3px;position:relative}
.rlegend .rlx{position:absolute;right:-4px;top:-2px;background:#1f2a44;color:#fff;border-radius:8px;width:28px;height:28px;line-height:28px;font-size:20px}
.rlegend span{display:block;font-size:17px;font-weight:600;color:#475569;margin:-4px 0 2px 32px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rlegend.mini{background:#fff;border:3px solid #1f2a44;border-radius:22px;padding:6px 14px;font-size:20px;font-weight:800;cursor:pointer;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.rlegend.mini b{display:inline-block;background:#1f2a44;color:#fff;border-radius:8px;width:26px;height:26px;line-height:26px;text-align:center;margin-left:4px}
#pbar{display:none;position:fixed;right:10px;bottom:10px;z-index:40;gap:6px;align-items:center;background:rgba(31,42,68,.9);color:#fff;padding:5px 8px;border-radius:12px;opacity:.25;transition:opacity .2s}
#pbar:hover{opacity:1}
#pbar .tbtn{padding:5px 10px;font-size:14px}
#ptimer{font-variant-numeric:tabular-nums;font-size:14px;padding:0 6px;white-space:nowrap}
body.present #pbar{display:flex}
body.present #topbar,body.present #view-class .hint,body.present #view-class .notice{display:none!important}

body.present main#view-class{padding:6px 10px 0}
body.present #kbuf{bottom:80px}
#tw{position:fixed;left:20px;bottom:20px;z-index:45;width:620px;max-width:calc(100vw - 30px);background:#fff;border:4px solid #1f2a44;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;user-select:none}
.twh{display:flex;align-items:center;gap:6px;background:#1f2a44;color:#fff;padding:6px 8px 6px 14px;cursor:move;touch-action:none}
.twh .twt{font-weight:800;flex:1;font-size:20px}
.twh button{border:0;background:#33415f;color:#fff;border-radius:8px;width:40px;height:36px;font-weight:900;font-size:18px}
.twmini{display:none;font-weight:900;font-size:52px;font-variant-numeric:tabular-nums}
#tw.min{width:auto}
#tw.min .twbody{display:none}
#tw.min .twmini{display:inline}
#tw.min .twt{flex:none}
.twbody{padding:10px 14px 14px;text-align:center}
.twd{font-size:200px;letter-spacing:2px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;color:#1f2a44}
.twd.warn{color:#dc2626;animation:twp .6s infinite alternate}
@keyframes twp{to{transform:scale(1.06)}}
.twbar{height:20px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin:6px 0 10px}
#twfill{height:100%;width:100%;background:#22c55e;transition:width .25s linear}
.twp,.twc,.twcu{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
#tw .twbody button{border:1px solid #d6cfbf;background:#faf8f3;border-radius:10px;padding:8px 13px;font-weight:800;font-size:17px;color:#1f2a44}
#tw .twbody button.go{background:#10b981;color:#fff;border-color:#10b981;padding:8px 22px;font-size:20px}

function guessWeekly(name){const m=String(name).match(/\d/);return m&&+m[0]<=4?1:2;}
function goalOf(c){return c.goal||DEF_GOAL[c.weekly||2];}
function perOf(c){return c.per!=null?c.per:DEF_PER[c.weekly||2];}
function setWeekly(c,w){c.weekly=w;c.goal=DEF_GOAL[w];c.per=DEF_PER[w];c.goalShown=c.energy>=c.goal?c.goalShown:false;}
function syncGroups(c){const m={};for(const id in c.seats)m[c.seats[id]]=id;c.students.forEach(s=>{const id=m[s.no];s.group=id?+id.split('-')[0]:0;});}

function ensureSeats(c){
  c.groups=5;
  if(c.weekly==null)setWeekly(c,guessWeekly(c.name));
  if(c.baskets==null)c.baskets=c.harvests||0;
  if(!c.redeems)c.redeems=[];
  if(!c.seats){c.seats={};seatStudents(c,c.students.slice().sort((a,b)=>a.no-b.no).map(s=>({no:s.no,g:s.group})));}
  const nos=new Set(c.students.map(s=>s.no));
  for(const id in c.seats){if(!nos.has(c.seats[id])||!SEATS.find(x=>x.id===id))delete c.seats[id];}
  syncGroups(c);
}
function newClass(name,n,groups){

}
function autoGroup(c){c.groups=5;c.seats={};const list=c.students.slice().sort((a,b)=>a.no-b.no);list.forEach((s,i)=>{if(i<SEATS.length)c.seats[SEATS[i].id]=s.no;});syncGroups(c);}

function endLesson(){
  const c=cur();if(!c||!c.session)return;

      act.forEach(g=>{const v=gs[g]||0,rank=act.filter(h=>(gs[h]||0)>v).length;let n=(mn<best&&v===mn)?ra[4]:ra[Math.min(rank,3)];if(v===best)top.push(g);award[g]=n;c.groupPts[g]=(c.groupPts[g]||0)+n;});}

    const sick=[],warn=[];
    {const act=[1,2,3,4,5].filter(g=>c.students.some(s=>s.group===g));const vals=act.map(g=>gs[g]||0),mn=Math.min(...vals),mx=Math.max(...vals);
     act.forEach(g=>{const b=guard(c,g);if(mx>mn&&(gs[g]||0)===mn){b.lastStreak=(b.lastStreak||0)+1;if(b.lastStreak>=sickN()&&!b.sick){b.sick=true;b.sickWhy='連續 '+sickN()+' 次最後一名';b.lastStreak=0;sick.push(g);}else if(!b.sick&&b.lastStreak===sickN()-1)warn.push(g);}else b.lastStreak=0;});
     save();renderView();}

function mark(no){
  const c=cur();if(!c)return;

  if(!s){toast('這個班沒有 '+no+' 號');return;}
  if(!c.session){toast('請先按「▶ 開始上課」');return;}

  ses.ivG[s.group]=(ses.ivG[s.group]||0)+1;ses.ivAll=(ses.ivAll||0)+1;

function undo(){
  const c=cur();if(!c||!c.session||!c.session.undo.length){toast('沒有可以復原的紀錄');return;}
  const ses=c.session,ev=ses.undo.pop();
  if(ev.type==='gs'){ses.gScore[ev.g]=Math.max(0,(ses.gScore[ev.g]||0)-ev.d);save();renderClass();toast('已復原第 '+ev.g+' 組的'+(ev.d>0?'加分':'扣分'));return;}
  if(ev.dropped){ses.apples=(ses.apples||0)+1;}
  if(ev.type==='apple'){ses.apples=(ses.apples||0)+1;save();renderClass();toast('🍎 蘋果回到樹上了');return;}
  ses.counts[ev.no]=ev.prev;if(ev.prevLast)ses.last[ev.no]=ev.prevLast;else delete ses.last[ev.no];
  ses.totals[ev.no]=Math.max(0,(ses.totals[ev.no]||0)-1);if(!ses.totals[ev.no])delete ses.totals[ev.no];
  if(ev.iv===ses.iv){ses.ivG[ev.g]=Math.max(0,(ses.ivG[ev.g]||0)-1);ses.ivAll=Math.max(0,(ses.ivAll||0)-1);}
  save();renderClass();toast('已復原 '+ev.no+' 號的一次紀錄');
}
function processIntervals(c,now,quiet){
  const ses=c.session;if(!ses)return;
  const iv=S.settings.interval*60000,cap=90*60000;
  const idx=Math.floor(Math.min(now-ses.start,cap)/iv);
  const winners=new Set();let up=0,ran=false;
  while(ses.iv<idx){
    for(let g=1;g<=c.groups;g++){
      if(c.students.some(s=>s.group===g)&&!(ses.ivG[g]>0)){ses.gScore=ses.gScore||{};ses.gScore[g]=(ses.gScore[g]||0)+1;winners.add(g);}
    }
    ses.ivG={};ses.ivAll=0;ses.iv++;ran=true;
  }
  if(!ran)return;
  save();if(!winners.size)return;
  if(c.id===S.cur&&!quiet){
    renderEnergy();if(view==='class')renderClass();
    winners.forEach(g=>{const el=document.getElementById('g'+g);if(el)el.classList.add('win');});
    toast((winners.size?'安靜加分：第 '+Array.from(winners).sort((a,b)=>a-b).join('、')+' 組 +1 分　':'')+'');
  }
  checkGoal(c);
}
function processRecovery(c,now){
  const ses=c.session;if(!ses||!(S.settings.recoverMin>0))return;
  const rm=S.settings.recoverMin*60000,rec=[];
  for(const no in ses.counts){if(ses.counts[no]>0&&ses.last[no]&&now-ses.last[no]>=rm){ses.counts[no]--;ses.last[no]=now;rec.push(no);}}
  if(rec.length){save();if(c.id===S.cur){if(view==='class')renderClass();toast(rec.join('、')+' 號保持安靜，回復一格 ✨');}}
}

function harvest(c){

function printPage(c,tv){
  const X=(x,w)=>tv?1920-x-w:x,Y=(y,h)=>tv?1080-y-h:y;
  const d=new Date(),ds=d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate();
  let h='<div class="pp"><div class="ptitle">'+esc(c.name)+'　座位表'+(tv?'（老師視角）':'')+'<span>列印日期 '+ds+'</span></div><div class="pwrap"><div class="pmap">'+
    '<div class="board" style="left:'+X(273,1408)+'px;top:'+Y(22,40)+'px">黑板</div><div class="piano" style="left:'+X(676,154)+'px;top:'+Y(80,60)+'px">鋼琴</div>';
  LAYOUT.forEach(G=>{h+='<div class="gcirc" style="left:'+X(G.cx-95,190)+'px;top:'+Y(G.cy-95,190)+'px;background:'+G.circ+'"><span class="gnum">'+G.g+'</span><span style="position:absolute;right:-20px;top:-12px">'+flower(G.fl,68)+'</span><span style="position:absolute;right:-30px;bottom:44px">'+flower(G.fl,40)+'</span></div>';});
  SEATS.forEach(st=>{
    const no=c.seats[st.id],s=no!=null?c.students.find(x=>x.no===no):null,v=st.h>st.w;
    let inner='';
    if(s){const len=[...s.name].length;const fs=v?(len<=3?34:len===4?28:22):(len<=3?34:len===4?27:21);inner='<span class="sn">'+s.no+'</span><span class="sm" style="font-size:'+fs+'px">'+esc(s.name)+'</span>';}
    h+='<div class="pseat '+(v?'v':'h')+'" style="left:'+X(st.x,st.w)+'px;top:'+Y(st.y,st.h)+'px;width:'+st.w+'px;height:'+st.h+'px;background:'+st.G.color+'">'+inner+'</div>';
  });
  h+=stickers(c,st=>({x:X(st.x,st.w),y:Y(st.y,st.h)}))+legendHTML(c,X(548,180),Y(690,280),'print');
  return h+'</div></div></div>';
}
function doPrint(list){
  const tv=S.settings.printView==='teacher';
  $('#printArea').innerHTML=list.map(c=>printPage(c,tv)).join('');
  setTimeout(()=>{try{window.print();}catch(e){toast('這個視窗不能列印，請用瀏覽器直接開啟檔案');}},80);
}
function askPrint(){
  const c=cur();if(!c)return;
  const pv=S.settings.printView==='teacher'?'teacher':'student';
  const chip=(v,label,sub)=>'<button class="chip'+(pv===v?' on':'')+'" data-pv="'+v+'" style="padding:10px 16px;text-align:center">'+label+'<br><span style="font-size:13px;font-weight:600">'+sub+'</span></button>';
  modal('<h2>🖨️ 列印座位表</h2><div style="margin-bottom:10px">A4 橫式，一個班一頁。選擇方向：</div><div class="chips" style="justify-content:center">'+
    chip('student','👀 學生視角','黑板在上方')+chip('teacher','🧑‍🏫 老師視角','黑板在下方，從講台往台下看')+'</div>'+
    '<div class="acts"><button class="btn" data-act="no">取消</button>'+(S.classes.length>1?'<button class="btn" data-act="all">全部班級（'+S.classes.length+' 頁）</button>':'')+'<button class="btn pri" data-act="one">列印 '+esc(c.name)+'</button></div>','',{one:()=>doPrint([c]),all:()=>doPrint(S.classes)});
}

function decoShop(){if(!Array.isArray(S.decoShop))S.decoShop=DEF_DECO.map(x=>Object.assign({},x));return S.decoShop;}
function decosHTML(c){
  const D=c.decos||{};let h='';
  for(let g=1;g<=5;g++)(D[g]||[]).slice(-12).forEach((d,i)=>{const sp=decoShop().find(x=>x.k===d.k)||{};const sz=d.sz||sp.sz||60;
    h+='<div class="deco'+((d.sw||sp.sw)?' sway':'')+((d.fl||sp.fl)?' float':'')+'" data-dg="'+g+'" data-did="'+d.id+'" style="left:'+(d.x-sz/2)+'px;top:'+(d.y-sz)+'px;font-size:'+sz+'px"><span style="animation-delay:'+(i*0.4)+'s">'+d.icon+'</span></div>';});
  return h;
}
function decoSpot(g){const b=PBOX[g],G=LAYOUT[g-1],EXg={1:1240,2:1240,3:676,4:532,5:580}[g];
  const x0=Math.min(G.gx,EXg)-30,x1=Math.max(G.gx+86,EXg+150)+30,y0=G.cy-122,y1=G.cy+150;
  const B=[b[0]-10,b[1]-10,b[2]+10,b[3]+20];let q;
  for(const R of [135,110,80]){for(let t=0;t<80;t++){q={x:B[0]+Math.random()*(B[2]-B[0]),y:B[1]+40+Math.random()*(B[3]-B[1]-40)};
    const inPanel=q.x>x0&&q.x<x1&&q.y>y0&&q.y<y1,inLeg=q.x>520&&q.x<760&&q.y>570&&q.y<680;
    if(Math.hypot(q.x-G.cx,q.y-30-G.cy)>R&&!inPanel&&!inLeg)return q;}}
  return q;}
function petsHTML(c){
  const P=c.pets||{};let h='';
  for(let g=1;g<=5;g++){const list=(P[g]||[]).slice(-8),b=PBOX[g];
    list.forEach((pt,i)=>{const sp=petShop().find(x=>x.k===pt.k)||{icon:pt.icon||'🐾'};
      if(!petPos[pt.id])petPos[pt.id]={x:b[0]+Math.random()*(b[2]-b[0]),y:b[1]+Math.random()*(b[3]-b[1]),f:Math.random()<.5};
      const q=petPos[pt.id];
      h+='<div class="pet'+(q.f?' flip':'')+'" data-g="'+g+'" data-id="'+pt.id+'" style="left:'+q.x+'px;top:'+q.y+'px"><span style="animation-delay:'+(i*0.13)+'s">'+(pt.icon||sp.icon)+'</span></div>';});
  }
  return h;
}
function wander(){
  if(view!=='class')return;
  document.querySelectorAll('#map .pet').forEach(el=>{
    if(Math.random()<0.45)return;
    const b=PBOX[el.dataset.g],id=el.dataset.id,old=petPos[id]||{x:b[0],y:b[1]};
    const x=Math.max(b[0],Math.min(b[2],old.x+(Math.random()-.5)*240)),y=Math.max(b[1],Math.min(b[3],old.y+(Math.random()-.5)*180));
    const f=x<old.x;el.classList.toggle('flip',f);el.style.left=x+'px';el.style.top=y+'px';petPos[id]={x:x,y:y,f:f};
  });
}
setInterval(wander,2300);
function petShopHTML(c){
  const isPet=petTab==='pet',own=isPet?(c.pets||{}):(c.decos||{}),shop=isPet?petShop():decoShop();
  let h='<div class="panel"><div class="row" style="justify-content:space-between;margin:0 0 10px"><div class="row" style="margin:0"><h2 style="margin:0 8px 0 0">🌱 小組樂園：用 ⭐ 換</h2><div class="seg"><button class="'+(isPet?'on':'')+'" data-pt="tab" data-v="pet">🐾 小動物</button><button class="'+(!isPet?'on':'')+'" data-pt="tab" data-v="deco">🌷 裝飾</button></div></div><button class="btn'+(petEdit?' pri':'')+'" data-pt="edit">'+(petEdit?'✔ 完成':'✏️ 調整價格')+'</button></div>'+
    '<div class="small" style="margin-bottom:10px">'+(isPet?'換到的小動物會在那組的座位區裡走來走去（每組最多顯示 8 隻）。':'換到的裝飾會擺在那組的座位區（每組最多顯示 12 個），按「🔀 重新擺放」可以換位置。')+'點已經有的項目可以送走並退回 ⭐。</div>';
  if(petEdit){
    h+='<div class="row">'+shop.map((x,i)=>'<span class="chip">'+x.icon+' '+esc(x.name)+' <input type="number" min="1" max="99" value="'+x.cost+'" data-ptc="'+i+'" style="width:60px"> ⭐</span>').join('')+'<button class="btn sm" data-pt="reset">恢復預設價格</button></div></div>';
    return h;
  }
  for(let g=1;g<=5;g++){
    const G=LAYOUT[g-1],st=c.groupPts[g]||0,list=own[g]||[];
    h+='<div class="petrow" style="border-color:'+G.fl+'"><div class="prh" style="background:'+G.circ+'">第 '+g+' 組<br><span>⭐ '+st+'</span></div><div class="prb"><div class="prpets">'+
      (list.length?list.map(pt=>'<button class="pown" data-pt="rel" data-g="'+g+'" data-id="'+pt.id+'" title="送走（退回 ⭐）">'+pt.icon+'<small>'+esc(pt.name)+'</small></button>').join(''):'<span class="small">'+(isPet?'還沒有小動物':'還沒有裝飾')+'</span>')+
      (!isPet&&list.length?'<button class="btn sm" data-pt="shuffle" data-g="'+g+'">🔀 重新擺放</button>':'')+
      '</div><div class="prshop">'+shop.map((x,i)=>'<button class="pbuy" data-pt="buy" data-g="'+g+'" data-i="'+i+'"'+(st<x.cost?' disabled':'')+'><b>'+x.icon+'</b>'+x.cost+'⭐</button>').join('')+'</div></div></div>';
  }
  return h+'</div>';
}
function petShopClick(e){
  const b=e.target.closest('[data-pt]');if(!b)return false;const c=cur();if(!c)return true;const a=b.dataset.pt,isPet=petTab==='pet';
  const key=isPet?'pets':'decos',shop=isPet?petShop():decoShop();
  if(a==='tab'){petTab=b.dataset.v;petEdit=false;renderShop();}
  else if(a==='edit'){petEdit=!petEdit;renderShop();}
  else if(a==='reset'){if(isPet)S.petShop=DEF_PETS.map(x=>Object.assign({},x));else S.decoShop=DEF_DECO.map(x=>Object.assign({},x));save();renderShop();}
  else if(a==='shuffle'){const g=+b.dataset.g;((c.decos||{})[g]||[]).forEach(d=>Object.assign(d,decoSpot(g)));save();toast('第 '+g+' 組的裝飾換了新位置');}
  else if(a==='buy'){const g=+b.dataset.g,x=shop[+b.dataset.i];if(!x||(c.groupPts[g]||0)<x.cost)return true;
    confirmBox('第 '+g+' 組要換 '+x.icon+' '+x.name+' 嗎？','會用掉 ⭐ '+x.cost+'（剩 '+((c.groupPts[g]||0)-x.cost)+' 顆）。','換！',()=>{
      c.groupPts[g]-=x.cost;c[key]=c[key]||{};const item={id:uid(),k:x.k,icon:x.icon,name:x.name,cost:x.cost,t:Date.now()};
      if(!isPet)Object.assign(item,decoSpot(g),{sz:x.sz,sw:x.sw,fl:x.fl});
      (c[key][g]=c[key][g]||[]).push(item);save();renderShop();
      modal('<div class="big" style="font-size:110px;animation:pethop .5s infinite alternate">'+x.icon+'</div><h2>第 '+g+' 組獲得了'+esc(x.name)+'！</h2><div style="font-size:18px">'+(isPet?'上課時牠會在第 '+g+' 組的座位區走來走去 🐾':'已經擺在第 '+g+' 組的座位區了 🌷')+'</div><div class="acts"><button class="btn pri" data-act="x">太棒了！</button></div>','party',{});});}
  else if(a==='rel'){const g=+b.dataset.g,list=(c[key]&&c[key][g])||[],pt=list.find(x=>x.id===b.dataset.id);if(!pt)return true;
    confirmBox('送走'+pt.icon+' '+pt.name+'？','第 '+g+' 組會拿回 ⭐ '+(pt.cost||0)+'。','送走',()=>{c[key][g]=list.filter(x=>x.id!==pt.id);c.groupPts[g]=(c.groupPts[g]||0)+(pt.cost||0);save();renderShop();},true);}
  return true;
}
$('#view-shop').addEventListener('change',e=>{if(e.target.dataset.ptc!=null){const x=(petTab==='pet'?petShop():decoShop())[+e.target.dataset.ptc],v=parseInt(e.target.value);if(x&&v>0){x.cost=Math.min(99,v);save();toast(x.name+' 改為 '+x.cost+' ⭐');}}});

(function(){let drag=null;
  $('#view-class').addEventListener('pointerdown',e=>{
    if(!editMode)return;const el=e.target.closest('.deco[data-did]');if(!el)return;e.preventDefault();
    const map=$('#map'),k=map.getBoundingClientRect().width/1920;
    drag={el:el,k:k,sx:e.clientX,sy:e.clientY,l:parseFloat(el.style.left),t:parseFloat(el.style.top)};el.setPointerCapture(e.pointerId);el.classList.add('dragging');});
  $('#view-class').addEventListener('pointermove',e=>{if(!drag)return;drag.el.style.left=(drag.l+(e.clientX-drag.sx)/drag.k)+'px';drag.el.style.top=(drag.t+(e.clientY-drag.sy)/drag.k)+'px';});
  $('#view-class').addEventListener('pointerup',e=>{if(!drag)return;const el=drag.el,c=cur();el.classList.remove('dragging');
    const g=el.dataset.dg,d=c&&c.decos&&(c.decos[g]||[]).find(x=>x.id===el.dataset.did);
    if(d){const sz=parseFloat(el.style.fontSize)||60;d.x=Math.max(0,Math.min(1920,parseFloat(el.style.left)+sz/2));d.y=Math.max(sz,Math.min(1080,parseFloat(el.style.top)+sz));save();}
    drag=null;});
})();

function wk(c){return (c&&c.weekly)===1?1:2;}
function evoCost(c){return evoTable()[wk(c||cur())];}
function boxPrizes(){
  const old='好寶寶貼紙|小文具一份|選一首下課歌|自選座位一節課|上台當小指揮|當一節課小老師';
  if(!Array.isArray(S.boxPrizes)||!S.boxPrizes.length||S.boxPrizes.map(x=>x.name).join('|')===old)S.boxPrizes=DEF_BOX.map(x=>Object.assign({},x));return S.boxPrizes;}
function boxMax(){return S.settings.boxMaxMarks==null?3:S.settings.boxMaxMarks;}
function cycleStart(b){return b.start||Date.now()-30*864e5;}
function marksSince(c,no,t){let n=0;(c.lessons||[]).forEach(l=>{if(l.start>=t)n+=(l.totals&&l.totals[no])||0;});if(c.session)n+=c.session.totals[no]||0;return n;}
function eligible(c,g,no){return marksSince(c,no,cycleStart(guard(c,g)))<=boxMax();}
function prizePool(c,g,no){
  const b=guard(c,g),ok=eligible(c,g,no),used={};Object.values(b.boxes||{}).forEach(r=>used[r.prize]=(used[r.prize]||0)+1);
  return boxPrizes().filter(x=>(+x.w||0)>0&&(!x.elig||ok)&&(!x.cap||(used[x.name]||0)<x.cap));
}

function pickQuotes(c){

  [1,2,3,4,5].forEach(g=>{let cand=pool.map((x,i)=>i).filter(i=>!used.has(i));if(!cand.length)cand=pool.map((x,i)=>i);const i=cand[Math.floor(Math.random()*cand.length)];q[g]=pool[i];used.add(i);c.quoteUsed=(c.quoteUsed||[]).concat(i).slice(-60);});
  return q;
}

  if(t.dataset.gtype){guard(c,+t.dataset.gtype).type=t.value;save();renderShop();toast(t.value==='random'?'第 '+t.dataset.gtype+' 組是驚喜蛋，孵化時才知道是什麼神獸！':'第 '+t.dataset.gtype+' 組的蛋是「'+BEASTS[t.value].name+'」');}
  else if(t.dataset.evo!=null){const v=parseInt(t.value),[w,i]=t.dataset.evo.split('_');if(v>0){evoTable()[w][+i]=Math.min(99,v);save();renderShop();toast('已儲存');}}
  else if(t.dataset.heal!=null){S.healCost2[t.dataset.heal]=Math.max(0,parseInt(t.value)||0);save();toast('已儲存');}
  else if(t.dataset.rank!=null){rankAward()[+t.dataset.rank]=Math.max(0,parseInt(t.value)||0);save();toast('已儲存');}
  else if(t.id==='sickN'){S.settings.sickStreak=Math.max(2,parseInt(t.value)||3);save();toast('已儲存');}
  else if(t.id==='cleanN'){S.settings.cleanFailN=Math.max(1,parseInt(t.value)||5);save();toast('已儲存');}
  else if(t.id==='healC'){S.settings.healCost=Math.max(0,parseInt(t.value)||0);save();toast('已儲存');}
  else if(t.id==='bQuotes'){S.settings.beastQuotes=t.value;save();toast('已儲存喊話（'+quotePool().length+' 句）');}
  else if(t.id==='quoteSec'){S.settings.quoteSec=Math.max(5,parseInt(t.value)||20);save();toast('已儲存');}
  else if(t.id==='bSpeech'){S.settings.beastSpeech=t.value;save();toast('已儲存道別的話');}
  else if(t.id==='boxMax'){S.settings.boxMaxMarks=Math.max(0,parseInt(t.value)||0);save();toast('已儲存：被記 '+boxMax()+' 次以內算表現良好');}
  else if(t.dataset.bx!=null){const x=boxPrizes()[+t.dataset.bx];if(!x)return;const f=t.dataset.f;if(f==='w')x.w=Math.max(0,parseInt(t.value)||0);else if(f==='cap')x.cap=Math.max(0,parseInt(t.value)||0);else if(f==='elig')x.elig=t.checked;else x[f]=t.value.trim()||x[f];save();renderShop();}
  else if(t.dataset.given){const r=(c.boxLog||[]).find(x=>x.id===t.dataset.given);if(r){r.given=t.checked;save();}}
});

let boxMode='grid',twT=null;
function beastSpeech(c,g){
  const b=guard(c,g),mem=c.students.filter(s=>s.group===g).sort((x,y)=>x.no-y.no).map(s=>s.name).join('、');

  if(!b.speechIdx&&b.speechIdx!==0)b.speechIdx=Math.floor(Math.random()*DEF_SPEECH.length);
  const t=custom||DEF_SPEECH[b.speechIdx%DEF_SPEECH.length];

$('#box').addEventListener('click',e=>{
  if(e.target.id==='box'){closeBox();return;}
  const b=e.target.closest('[data-bxa]');if(!b)return;const c=cur(),a=b.dataset.bxa;
  if(a==='close')closeBox();
  else if(a==='reborn'){closeBox();guardAction('reborn',boxG);}
  else if(a==='skip'){clearInterval(twT);$('#spText').textContent=beastSpeech(c,boxG);b.classList.add('hidden');$('#spGo').classList.remove('hidden');}
  else if(a==='toBox'){clearInterval(twT);boxMode='grid';renderBox(false);}
  else if(a==='again'){boxMode='speech';renderBox(false);}
  else if(a==='open'){
    if(b.classList.contains('shaking'))return;const no=+b.dataset.no,s=c.students.find(x=>x.no===no);ensureAudio();
    b.classList.add('shaking');let n=0;const tk=setInterval(()=>{tone(500+n*60,0.06,'square',0.12);n++;},110);
    setTimeout(()=>{clearInterval(tk);const x=pickPrize(c,boxG,no),gd=guard(c,boxG);gd.boxes[no]={icon:x.icon,prize:x.name,r:x.r};
      c.boxLog=c.boxLog||[];c.boxLog.push({id:uid(),t:Date.now(),g:boxG,no:no,name:s?s.name:'',icon:x.icon,prize:x.name,r:x.r,given:false});save();
      if(x.r==='SSR'||x.r==='SR')fanfare();else tone(880,0.3,'triangle',0.25);renderBox(false);
      const el=[...document.querySelectorAll('#box .bx.open')].find(d=>d.querySelector('.bxn').textContent.startsWith(no+' '));if(el){el.classList.add('pop');if(x.r==='SSR')el.classList.add('ssr');}},1200);
  }
});

const DEF_CLEAN=[{icon:'🪑',name:'桌椅排整齊'},{icon:'🧹',name:'地板淨空'},{icon:'🗄️',name:'抽屜淨空'}];
function cleanItems(){if(!Array.isArray(S.cleanItems)||!S.cleanItems.length)S.cleanItems=DEF_CLEAN.map(x=>Object.assign({},x));return S.cleanItems;}
let CL={done:{}},cleanEdit=false;
function openClean(){const c=cur();if(!c)return;CL={done:{},cel:false,forceAsk:!!(arguments[0])};cleanEdit=false;$('#clean').classList.remove('hidden');renderClean(true);}

function settleClean(){
  const c=cur();if(!c){closeClean();return;}const it=cleanItems(),act=[1,2,3,4,5].filter(g=>c.students.some(s=>s.group===g));
  const fail=act.filter(g=>!it.every((x,i)=>CL.done[g+'_'+i]));
  const bye=()=>{};
  if(CL.settled||!Object.keys(CL.done).length&&!CL.forceAsk){closeClean();if(CL.settled)bye();return;}
  if(!fail.length){CL.settled=true;closeClean();bye();return;}
  closeClean();
  modal('<div style="font-size:60px">🧹</div><h2>還有組別沒通過檢查</h2><div style="font-size:20px">第 '+fail.join('、')+' 組還沒全部打勾。<br>要記錄「未通過」一次嗎？累積 '+cleanN()+' 次，守護獸會生病。</div>'+
    '<div class="small" style="margin-top:6px">'+fail.map(g=>'第 '+g+' 組目前 '+(guard(c,g).cleanFails||0)+' / '+cleanN()).join('　')+'</div>'+
    '<div class="acts"><button class="btn" data-act="back">回去繼續檢查</button><button class="btn" data-act="x">先不記錄</button><button class="btn danger" data-act="rec">記錄未通過</button></div>','',{
      back:()=>{$('#clean').classList.remove('hidden');renderClean(false);},x:bye,
      rec:()=>{CL.settled=true;const sick=[];fail.forEach(g=>{const b=guard(c,g);b.cleanFails=(b.cleanFails||0)+1;if(b.cleanFails>=cleanN()&&!b.sick){b.sick=true;b.sickWhy='下課整理累積 '+cleanN()+' 次沒通過';b.cleanFails=0;sick.push(g);}});save();renderView();

        else{toast('已記錄：第 '+fail.join('、')+' 組未通過');bye();}}});
}

$('#clean').addEventListener('click',e=>{
  if(e.target.id==='clean'){settleClean();return;}
  const b=e.target.closest('[data-cl]');if(!b)return;const a=b.dataset.cl,c=cur();
  if(a==='close'){settleClean();return;}
  if(a==='nosettle'){closeClean();return;}
  if(a==='tick'){const k=b.dataset.k;CL.done[k]=!CL.done[k];if(!CL.done[k]){CL.music=false;CL.cel=false;}if(CL.done[k]){ensureAudio();tone(1046,0.12,'triangle',0.2);}const g=k.split('_')[0];if(cleanItems().every((x,i)=>CL.done[g+'_'+i]))setTimeout(()=>tone(1318,0.25,'triangle',0.25),120);}
  else if(a==='all'){const g=b.dataset.g;cleanItems().forEach((x,i)=>CL.done[g+'_'+i]=true);ensureAudio();tone(1318,0.25,'triangle',0.25);}

/* ---------- countdown timer ---------- */
const TW={total:180000,remain:180000,end:null};let audioCtx=null;
function twFmt(ms){const t=Math.ceil(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function twRender(){
  const rem=TW.end?Math.max(0,TW.end-Date.now()):TW.remain;
  $('#twd').textContent=twFmt(rem);$('#twmini').textContent=(TW.end?'▶ ':'')+twFmt(rem);
  $('#twd').classList.toggle('warn',!!TW.end&&rem<=10000);
  const f=$('#twfill');f.style.width=(TW.total?rem/TW.total*100:0)+'%';f.style.background=rem<=10000?'#dc2626':rem<=TW.total*0.3?'#f59e0b':'#22c55e';
  const g=$('#twGo');if(TW.end){g.textContent='⏸ 暫停';g.className='pause';}else{g.textContent=TW.remain<TW.total&&TW.remain>0?'▶ 繼續':'▶ 開始';g.className='go';}
  const pt=$('#pTimer');if(pt)pt.textContent=TW.end?'⏱️ '+twFmt(rem):'⏱️';
  const st=$('#sTimer');if(st){st.textContent=TW.end?'⏱️ '+twFmt(rem):'⏱️ 計時器';st.classList.toggle('run',!!TW.end);}
}
function twSet(sec){TW.total=TW.remain=Math.max(1,sec)*1000;TW.end=null;twRender();}
let alarmT=null,alarmN=0;
function ringOnce(){
  try{if(!audioCtx)return;const t0=audioCtx.currentTime+0.02;
    const comp=audioCtx.createDynamicsCompressor();const master=audioCtx.createGain();master.gain.value=(S.settings.alarmVol==null?0.35:S.settings.alarmVol);master.connect(comp).connect(audioCtx.destination);
    const pat=[[0,988],[0.18,988],[0.36,988],[0.54,1319,0.55]];
    pat.forEach(([d,f,len])=>{len=len||0.14;['square','sine'].forEach(type=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=type==='sine'?f*2:f;
      const peak=type==='square'?0.55:0.35;g.gain.setValueAtTime(0.0001,t0+d);g.gain.exponentialRampToValueAtTime(peak,t0+d+0.01);g.gain.setValueAtTime(peak,t0+d+len-0.03);g.gain.exponentialRampToValueAtTime(0.0001,t0+d+len);
      o.connect(g).connect(master);o.start(t0+d);o.stop(t0+d+len+0.02);});});
  }catch(e){}
}
function beep(){stopAlarm();alarmN=0;ringOnce();alarmT=setInterval(()=>{alarmN++;if(alarmN>=8){stopAlarm();return;}ringOnce();},1400);}
function stopAlarm(){if(alarmT){clearInterval(alarmT);alarmT=null;}}
function twTick(){
  if(TW.end&&Date.now()>=TW.end){TW.end=null;TW.remain=0;twRender();beep();
    modal('<div class="timeup">⏰</div><h2>時間到！</h2><div class="acts"><button class="btn pri" data-act="x">好的</button><button class="btn" data-act="again">再計一次</button></div>','party',{again:()=>{TW.remain=TW.total;twStart();}});document.querySelector('#overlay .modal').classList.add('tu');
    return;}
  if(TW.end)twRender();
}
function twStart(){
  try{if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}
  if(TW.remain<=0)TW.remain=TW.total;TW.end=Date.now()+TW.remain;twRender();
}
function twPause(){if(!TW.end)return;TW.remain=Math.max(0,TW.end-Date.now());TW.end=null;twRender();}
function twToggleOpen(){const w=$('#tw');w.classList.toggle('hidden');if(!w.classList.contains('hidden'))w.classList.remove('min');twRender();}

{const v=$('#twVol');v.value=Math.round((S.settings.alarmVol==null?0.35:S.settings.alarmVol)*100);v.addEventListener('input',()=>{S.settings.alarmVol=v.value/100;save();});$('#twTest').addEventListener('click',e=>{e.stopPropagation();ensureAudio();ringOnce();});}

  else if(b.id==='twGo')TW.end?twPause():twStart();

function doDraw(){
  const c=cur();if(!c||DR.rolling)return;ensureAudio();
  const nr=S.settings.drawNoRepeat!==false;
  let cand,all,names;
  if(DR.mode==='per'){
    c.drawn=c.drawn||[];const res=[];const r0=DR.range;DR.range=0;all=stuPool(c);DR.range=r0;if(!all.length){toast('沒有可以抽的同學');return;}
    let resetG=[];
    for(let g=1;g<=5;g++){
      const inG=all.filter(s=>s.group===g);if(!inG.length)continue;
      let d=new Set(c.drawn),cg=nr?inG.filter(s=>!d.has(s.no)):inG.slice();
      if(cg.length<Math.min(DR.per,inG.length)){const ids=new Set(inG.map(s=>s.no));c.drawn=c.drawn.filter(n=>!ids.has(n));cg=inG.slice();resetG.push(g);}
      const pool=cg.slice();for(let i=0;i<Math.min(DR.per,pool.length+i)&&pool.length;i++){if(i>=DR.per)break;res.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0].no);}
    }
    if(resetG.length)toast('第 '+resetG.join('、')+' 組都抽過了，這幾組重新開始一輪');
    DR.final=res;names=all.map(s=>s.no+' '+s.name);
  }else if(DR.mode==='stu'){
    all=stuPool(c);if(!all.length){toast('沒有可以抽的同學');return;}
    c.drawn=c.drawn||[];let d=new Set(c.drawn);cand=nr?all.filter(s=>!d.has(s.no)):all.slice();
    if(cand.length<Math.min(DR.count,all.length)){const inR=new Set(all.map(s=>s.no));c.drawn=c.drawn.filter(n=>!inR.has(n));cand=all.slice();toast('範圍內的同學都抽過了，重新開始一輪');}
    const n=Math.min(DR.count,cand.length),res=[];const pool=cand.slice();
    const spread=S.settings.drawSpread!==false&&DR.range===0;c.drawGH=c.drawGH||[];
    for(let i=0;i<n;i++){let k;
      if(spread){
        const inBatch=new Set(res.map(no=>(c.students.find(x=>x.no===no)||{}).group));
        const recent=c.drawGH.slice(-6),gs=[...new Set(pool.map(s=>s.group))];
        let gc=gs.filter(g=>!inBatch.has(g));if(!gc.length)gc=gs;{const lg=c.drawGH[c.drawGH.length-1];if(gc.length>1&&gc.includes(lg))gc=gc.filter(g=>g!==lg);}
        const w=gc.map(g=>{let r=0;recent.forEach((x,j)=>{if(x===g)r+=1+j/recent.length;});return 1/Math.pow(1+r,2);});
        let t=Math.random()*w.reduce((a,b)=>a+b,0),gi=0;for(;gi<gc.length-1;gi++){t-=w[gi];if(t<0)break;}
        const inG=pool.map((s,ix)=>ix).filter(ix=>pool[ix].group===gc[gi]);k=inG[Math.floor(Math.random()*inG.length)];
      }else k=Math.floor(Math.random()*pool.length);
      const st=pool.splice(k,1)[0];res.push(st.no);c.drawGH.push(st.group);}
    c.drawGH=c.drawGH.slice(-20);

  }else{
    all=grpPool(c);if(!all.length){toast('沒有小組可以抽');return;}
    c.drawnG=c.drawnG||[];cand=nr?all.filter(g=>!c.drawnG.includes(g)):all.slice();
    if(!cand.length){c.drawnG=[];cand=all.slice();toast('每組都抽過了，重新開始一輪');}

}

function slipText(c){const el=document.createElement('div');el.innerHTML=slipHTML(c);el.querySelectorAll('tr').forEach(tr=>{tr.appendChild(document.createTextNode('\n'));});el.querySelectorAll('td,th').forEach(td=>td.appendChild(document.createTextNode('　')));el.querySelectorAll('div').forEach(d=>d.appendChild(document.createTextNode('\n')));return el.textContent.replace(/\n{2,}/g,'\n').replace(/導師簽名：＿+/,'').trim();}
$('#notice').addEventListener('click',e=>{
  if(e.target.id==='notice'){$('#notice').classList.add('hidden');return;}
  const b=e.target.closest('[data-nt2]');if(!b)return;const c=cur(),a=b.dataset.nt2;
  if(a==='close'){$('#notice').classList.add('hidden');return;}
  if(a==='type'){NT.type=b.dataset.v;NT.excl={};NT.note='';}
  else if(a==='rng'){NT.to=isoDay();NT.from=isoDay(new Date(Date.now()-(+b.dataset.v)*864e5));NT.excl={};}
  else if(a==='excl'){const n=b.dataset.v;NT.excl[n]=!NT.excl[n];}
  else if(a==='pick'){const n=b.dataset.v;NT.examPick=NT.examPick||{};NT.examPick[n]=!NT.examPick[n];}
  else if(a==='copies'){NT.copies=+b.dataset.v;}
  else if(a==='per'){NT.per=+b.dataset.v;}
  else if(a==='cls'){const id=b.dataset.v;NT.cls[id]=!NT.cls[id];if(!S.classes.some(k=>NT.cls[k.id]))NT.cls[c.id]=true;}
  else if(a==='clsall'){S.classes.forEach(k=>NT.cls[k.id]=true);}
  else if(a==='copy'){const t=slipText(c);try{navigator.clipboard.writeText(t).then(()=>toast('已複製通知內容'),()=>toast('複製失敗'));}catch(err){toast('複製失敗');}return;}
  else if(a==='print'){
    const list=[];S.classes.filter(k=>NT.cls[k.id]).forEach(k=>{
      let html,empty;if(k.id===c.id){html=slipHTML(k);empty=NT.type!=='test'&&!ntRows(k).filter(r=>!NT.excl[r.no]).length;}
      else{const sv=[NT.excl,NT.examPick];NT.excl={};NT.examPick=null;html=slipHTML(k);empty=NT.type!=='test'&&!ntRows(k).length;NT.excl=sv[0];NT.examPick=sv[1];}
      if(empty&&NT.skipEmpty&&S.classes.filter(x=>NT.cls[x.id]).length>1)return;for(let i=0;i<NT.per;i++)list.push(html);});
    if(!list.length){toast('選到的班級都沒有名單');return;}
    const n=NT.copies;let out='';for(let i=0;i<list.length;i+=n){const pg=list.slice(i,i+n);while(n>1&&pg.length<n)pg.push('<div class="slip blank"></div>');out+='<div class="slpage n'+n+'">'+pg.join('')+'</div>';}
    $('#printArea').innerHTML=out;toast('準備列印 '+list.length+' 張');setTimeout(()=>{try{window.print();}catch(err){toast('這個視窗不能列印');}},120);return;}
  renderNotice(false);
});

function miniTree(c){
  const full=c.energy>=goalOf(c),shown=Math.round(Math.min(c.energy,goalOf(c))/goalOf(c)*30),leaf=full?['#84cc16','#a3e635']:['#4caf50','#6cc96b'];
  const nm=c.name,fs=Math.max(18,Math.min(44,Math.floor(186/Math.max(1,[...nm].reduce((a,ch)=>a+(/[\x00-\xff]/.test(ch)?0.6:1),0)))));
  let h='<svg viewBox="790 100 480 470">'+
    '<ellipse cx="1010" cy="545" rx="190" ry="20" fill="#7cb342" opacity=".7"/>'+
    '<path d="M982 545 L986 400 Q960 370 925 360 L930 352 Q965 360 990 385 L995 330 L1005 330 L1010 385 Q1035 360 1070 352 L1075 360 Q1040 370 1014 400 L1018 545 Z" fill="#8b5a2b"/>'+
    '<circle cx="890" cy="335" r="95" fill="'+leaf[0]+'"/><circle cx="1110" cy="335" r="95" fill="'+leaf[0]+'"/>'+
    '<circle cx="1000" cy="290" r="135" fill="'+leaf[1]+'"/><circle cx="1000" cy="215" r="100" fill="'+leaf[1]+'"/>';
  for(let i=0;i<shown;i++){const q=SLOTS[i];h+=APPLE.replace('<svg ','<svg x="'+(q[0]-20)+'" y="'+(q[1]-20)+'" ');}
  h+='<rect x="1140" y="500" width="20" height="48" rx="4" fill="#6b3f1d"/>'+
     '<rect x="1048" y="441" width="204" height="76" rx="12" fill="#c98a4b" stroke="#6b3f1d" stroke-width="6"/>'+
     '<text x="1150" y="481" text-anchor="middle" dominant-baseline="middle" font-size="'+fs+'" font-weight="900" fill="#fff">'+esc(nm)+'</text></svg>';
  return h;
}

function resizeImage(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{
      const sz=240,cv=document.createElement('canvas');cv.width=sz;cv.height=sz;
      const ctx=cv.getContext('2d'),mm=Math.min(img.width,img.height);
      const sx=(img.width-mm)/2,sy=(img.height-mm)*0.25;
      ctx.drawImage(img,sx,sy,mm,mm,0,0,sz,sz);res(cv.toDataURL('image/jpeg',0.78));
    };img.onerror=rej;img.src=r.result;};
    r.onerror=rej;r.readAsDataURL(file);
  });
}
$('#view-setup').addEventListener('click',e=>{
  const b=e.target.closest('[data-s]');if(!b)return;const s=b.dataset.s,c=cur();
  if(s==='pick'){S.cur=b.dataset.id;save();renderAll();}
  else if(s==='add'){
    const name=$('#newName').value.trim();const n=Math.max(1,Math.min(60,parseInt($('#newN').value)||28));
    if(!name){toast('請輸入班級名稱');return;}
    const k=newClass(name,n,5);setWeekly(k,guessWeekly(name));S.classes.push(k);S.cur=k.id;save();renderAll();toast('已新增 '+name+'（每週 '+k.weekly+' 節、目標 '+k.goal+' 顆），記得貼上名單');
  }
  else if(!c)return;
  else if(s==='saveinfo'){
    c.name=$('#cName').value.trim()||c.name;
    save();renderAll();toast('已儲存');
  }
  else if(s==='autogroup')confirmBox('依座號重新排座位？','會照座號 1、2、3…依序從第 1 組排到第 5 組，目前的座位安排會被取代。','重新排',()=>{autoGroup(c);save();renderAll();toast('已重新排座位');});
  else if(s==='roster'){
    const N=t=>t.replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0)).replace(/　/g,' ');
    const rows=$('#roster').value.split(/\r?\n/).map(l=>N(l).trim()).filter(Boolean);
    const out=[],used=new Set(),bad=[];let auto=1;
    rows.forEach(l=>{
      let parts=(l.includes('\t')?l.split('\t'):l.split(/[\s,，、]+/)).map(x=>x.trim()).filter(Boolean);
      if(!parts.length||/座號|姓名|組別/.test(parts.join('')))return;
      let no;const m0=parts[0].match(/^(\d+)\s*號?$/);
      if(m0){no=parseInt(m0[1]);parts=parts.slice(1);}else{while(used.has(auto))auto++;no=auto;}
      let g=null;
      if(parts.length>=2){const mg=parts[parts.length-1].match(/^第?\s*(\d+)\s*組?$/);if(mg){g=parseInt(mg[1]);parts=parts.slice(0,-1);}}
      if(g!=null&&(g<1||g>5)){bad.push(no+' 號的組別「'+g+'」不在 1～5 組，已自動安排');g=null;}
      if(used.has(no)){bad.push(no+' 號重複出現，只保留第一筆');return;}
      used.add(no);out.push({no:no,name:parts.join(' ')||('同學'+no),want:g});
    });
    if(!out.length){toast('名單是空的');return;}
    const old={};for(const id in c.seats)old[c.seats[id]]=id;
    c.seats={};
    const wanted=out.filter(o=>o.want!=null),free=out.filter(o=>o.want==null);
    wanted.forEach(o=>{const id=old[o.no];if(id&&+id.split('-')[0]===o.want){c.seats[id]=o.no;o.done=true;}});
    wanted.filter(o=>!o.done).forEach(o=>{const st=SEATS.find(x=>x.g===o.want&&c.seats[x.id]==null);if(st){c.seats[st.id]=o.no;o.done=true;}});
    free.forEach(o=>{const id=old[o.no];if(id&&c.seats[id]==null){c.seats[id]=o.no;o.done=true;}});
    out.filter(o=>!o.done).forEach(o=>{const st=SEATS.find(x=>c.seats[x.id]==null);if(st)c.seats[st.id]=o.no;});
    c.students=out.map(o=>({no:o.no,name:o.name,group:0}));syncGroups(c);
    save();renderAll();
    const cap={};SEATS.forEach(x=>cap[x.g]=(cap[x.g]||0)+1);
    const msgs=bad.slice();
    for(let g=1;g<=5;g++){
      const want=wanted.filter(o=>o.want===g);
      if(want.length>cap[g]){
        const moved=want.filter(o=>{const st=c.students.find(x=>x.no===o.no);return st&&st.group!==g;});
        msgs.push('第 '+g+' 組只有 '+cap[g]+' 個座位，名單寫了 '+want.length+' 位，所以 '+moved.map(o=>{const st=c.students.find(x=>x.no===o.no);return o.no+' 號'+esc(o.name)+(st.group?'→第 '+st.group+' 組':'→未入座');}).join('、'));
      }
    }
    const un=c.students.filter(x=>!x.group);
    if(un.length)msgs.push('座位只有 '+SEATS.length+' 個，'+un.map(x=>x.no+' 號').join('、')+' 沒有座位');
    if(msgs.length)modal('<h2>名單已更新（'+out.length+' 人）</h2><div style="text-align:left;line-height:1.7">有幾個地方要注意：<ul>'+msgs.map(m=>'<li>'+m+'</li>').join('')+'</ul>可以到「上課畫面」按「✏️ 調整座位」手動換。</div><div class="acts"><button class="btn pri" data-act="x">知道了</button></div>','',{});
    else toast('名單已更新：'+out.length+' 人，'+wanted.length+' 人照名單的組別入座');
  }
  else if(s==='del')confirmBox('刪除班級？','<b>'+esc(c.name)+'</b> 的名單、照片和所有紀錄都會刪除，無法復原。','刪除',()=>{
    c.students.forEach(st=>setPhoto(c.id,st.no,null));
    S.classes=S.classes.filter(k=>k.id!==c.id);S.cur=S.classes.length?S.classes[0].id:null;save();renderAll();
  },true);
  else if(s==='print')askPrint();
  else if(s==='rmph'){setPhoto(c.id,+b.dataset.no,null);renderSetup();}
  else if(s==='clearph')confirmBox('刪除所有照片？','<b>'+esc(c.name)+'</b> 的照片會從這個瀏覽器刪除。','刪除',()=>{c.students.forEach(st=>setPhoto(c.id,st.no,null));renderSetup();},true);
});

function importData(file){
  const r=new FileReader();
  r.onload=()=>{
    let d;try{d=JSON.parse(r.result);}catch(err){toast('這不是備份檔');return;}
    if(!d||d.app!=='class-order-energy'||!d.state||!Array.isArray(d.state.classes)){toast('這不是班級秩序能量站的備份檔');return;}
    const pn=Object.keys(d.photos||{}).length,dt=d.exported?new Date(d.exported).toLocaleString('zh-TW'):'不明';
    confirmBox('從備份還原？','備份時間：'+esc(dt)+'<br>'+d.state.classes.length+' 個班（'+d.state.classes.map(c=>esc(c.name)).join('、')+'）、'+pn+' 張照片<br><br><b>目前這台電腦上的資料會全部被取代。</b>','還原',()=>{
      if(store){const del=[];for(let i=0;i<store.length;i++){const k=store.key(i);if(k&&k.indexOf(PH)===0)del.push(k);}del.forEach(k=>{try{store.removeItem(k);}catch(err){}});}
      for(const k in photoCache)delete photoCache[k];
      let fail=0;
      for(const k in (d.photos||{})){if(k.indexOf(PH)!==0)continue;photoCache[k]=d.photos[k];if(store){try{store.setItem(k,d.photos[k]);}catch(err){fail++;}}}
      S=d.state;S.settings=Object.assign({},DEF_SET,S.settings||{});S.classes.forEach(ensureSeats);if(!Array.isArray(S.shop))S.shop=DEF_SHOP.map(x=>Object.assign({id:uid()},x));
      if(!S.classes.find(c=>c.id===S.cur))S.cur=S.classes.length?S.classes[0].id:null;
      for(const k in prevFruit)delete prevFruit[k];
      save();view='class';renderAll();toast('還原完成！'+(fail?'（有 '+fail+' 張照片因空間不足沒有存到）':''));
    },true);
  };
  r.onerror=()=>toast('讀不到這個檔案');
  r.readAsText(file);
}
$('#view-settings').addEventListener('change',e=>{
  if(e.target.id==='importFile'){const f=e.target.files[0];e.target.value='';if(f)importData(f);return;}
  if(e.target.dataset.cls){
    const c=S.classes.find(k=>k.id===e.target.dataset.cls);if(!c)return;const f=e.target.dataset.f,v=parseInt(e.target.value);
    if(f==='weekly'){setWeekly(c,v);toast(c.name+'：每週 '+v+' 節，目標 '+c.goal+' 顆、被記 '+c.per+' 次以內長果子');}
    else if(f==='goal'&&v>0){c.goal=Math.min(500,v);if(c.energy<c.goal)c.goalShown=false;toast(c.name+' 果子目標改為 '+c.goal+' 顆');}
    else if(f==='per'&&v>=0){c.per=Math.min(30,v);toast(c.name+'：被記 '+c.per+' 次以內就長果子');}
    save();renderSettings();renderEnergy();return;
  }
  const t=e.target,k=t.dataset.k;if(!k)return;
  if(t.type==='checkbox')S.settings[k]=t.checked;
  else if(t.type==='number'){const v=parseInt(t.value);if(!isNaN(v))S.settings[k]=Math.max(+t.min,Math.min(+t.max,v));}
  else S.settings[k]=t.value;
  S.classes.forEach(c=>{if(c.energy<goalOf(c))c.goalShown=false;});
  save();renderEnergy();toast('已儲存');
});

/* ---------- top bar & keyboard ---------- */
$('#energy').addEventListener('click',e=>{if(e.target.closest('#btnHarvest')){const c=cur();if(c)harvest(c);}});

$('#btnUndo').addEventListener('click',undo);
function enterPresent(){
  view='class';document.body.classList.add('present');renderAll();
  try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}catch(e){}
  setTimeout(fitMap,300);
}
function exitPresent(){
  document.body.classList.remove('present');
  try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}
  renderAll();setTimeout(fitMap,300);
}
$('#btnFull').addEventListener('click',enterPresent);
$('#pExit').addEventListener('click',exitPresent);
$('#pUndo').addEventListener('click',undo);
$('#pLesson').addEventListener('click',()=>{const c=cur();if(!c)return;c.session?endLesson():startLesson();});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('present')){document.body.classList.remove('present');renderAll();}setTimeout(fitMap,200);});
document.querySelector('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.view;renderView();});
$('#view-class').addEventListener('keydown',e=>{if(e.target.id==='ntIn'&&e.key==='Enter'){e.preventDefault();addNote();}});
$('#view-class').addEventListener('click',e=>{
  {const nb=e.target.closest('[data-nt]');if(nb){const c=cur();if(!c)return;const a=nb.dataset.nt;c.notes=c.notes||[];
    if(a==='add')addNote();
    else if(a==='tg'){const n=c.notes.find(x=>x.id===nb.dataset.id);if(n){n.done=!n.done;save();renderClass();}}
    else if(a==='del'){c.notes=c.notes.filter(x=>x.id!==nb.dataset.id);save();renderClass();}
    else if(a==='clr'){c.notes=c.notes.filter(x=>!x.done);save();renderClass();}
    return;}}
  {const tb=e.target.closest('[data-tool]');if(tb){if(tb.dataset.tool==='clean')openClean();else if(tb.dataset.tool==='draw')openDraw();else{const w=$('#tw');if(w.classList.contains('hidden'))twToggleOpen();else w.classList.remove('min');}return;}}
  {const bz=e.target.closest('[data-beast]');if(bz&&!editMode){beastModal(+bz.dataset.beast);return;}}
  if(e.target.closest('[data-tree]')){const c=cur(),ses=c&&c.session;if(!ses)return;if(ses.apples<=0){toast('樹上已經沒有蘋果了 😢');return;}
    const st0=treeState(ses.apples);pendingDrop={idx:fruitsShown(c)-1};ses.apples--;ses.undo.push({type:'apple'});save();const st1=treeState(ses.apples);
    const lab=document.querySelector('.treelabel');if(lab)lab.textContent='🍎 '+ses.apples+' / '+ses.applesStart;
    document.querySelectorAll('#map .fruit:not(.fall)').forEach((el,i,a)=>{if(i===a.length-1)el.remove();});playDrop();ensureAudio();tone(330,0.25,'sine',0.25);
    if(st1!==st0){setTimeout(()=>{if(view==='class')renderClass();},700);toast({yellow:'🍂 蘋果樹的葉子開始變黃了…',sparse:'🍂 蘋果樹的葉子越來越少，快安靜下來救救它！',dead:'😢 蘋果樹枯萎了…'}[st1]);}
    else if(ses.apples===3)toast('⚠️ 只剩 3 顆蘋果了，大家要安靜囉！');return;}
  if(e.target.closest('[data-notice]')){openNotice();return;}
  if(e.target.closest('[data-attopen]')){openAtt();return;}
  if(e.target.closest('#btnPrint')){askPrint();return;}
  {const gx=e.target.closest('[data-gsx]');if(gx&&!e.target.closest('[data-gs]')){const g=gx.dataset.gsx;S.settings.gsOpen=S.settings.gsOpen||{};S.settings.gsOpen[g]=!S.settings.gsOpen[g];save();renderClass();return;}}
  {const gb=e.target.closest('[data-gs]');if(gb){const c=cur();if(!c)return;if(!c.session){toast('請先按「▶ 開始上課」');return;}
    const g=+gb.dataset.gs,d=+gb.dataset.d,ses=c.session;ses.gScore=ses.gScore||{};const prev=ses.gScore[g]||0;if(d<0&&prev<=0)return;
    ses.gScore[g]=prev+d;if(d>0)toast('第 '+g+' 組 +'+d+' 分');ses.undo.push({type:'gs',g:g,d:d});if(ses.undo.length>60)ses.undo.shift();save();renderClass();
    const el=document.getElementById('g'+g);if(el&&d>0)el.classList.add('win');return;}}
  if(e.target.closest('[data-lg]')){S.settings.legendOpen=!S.settings.legendOpen;save();renderClass();return;}
  if(e.target.closest('#btnEdit')){editMode=!editMode;selSeat=null;renderClass();return;}
  const seat=e.target.closest('.seat'),u=e.target.closest('[data-u]'),c=cur();if(!c)return;
  if(editMode){
    const key=seat?seat.dataset.seat:u?'u'+u.dataset.u:null;if(!key)return;
    if(!selSeat||selSeat===key||(selSeat[0]==='u'&&key[0]==='u')){selSeat=selSeat===key?null:key;renderClass();return;}
    const a=selSeat,b=key;selSeat=null;
    const occ=id=>id[0]==='u'?+id.slice(1):c.seats[id];
    const na=occ(a),nb=occ(b);
    if(a[0]==='u')c.seats[b]=na;
    else if(b[0]==='u')c.seats[a]=nb;
    else{if(nb!=null)c.seats[a]=nb;else delete c.seats[a];if(na!=null)c.seats[b]=na;else delete c.seats[b];}
    syncGroups(c);save();renderClass();return;
  }
  if(seat&&seat.dataset.no)mark(+seat.dataset.no);else if(u)mark(+u.dataset.u);
});

let buf='',bufT;
function showBuf(){const k=$('#kbuf');k.textContent=buf+' 號';k.classList.toggle('hidden',!buf);clearTimeout(bufT);if(buf)bufT=setTimeout(()=>{buf='';showBuf();},3000);}
document.addEventListener('keydown',e=>{
  if(!$('#notice').classList.contains('hidden')){if(e.key==='Escape')$('#notice').classList.add('hidden');return;}
  if(!$('#bye').classList.contains('hidden')){closeBye();return;}
  if(!$('#clean').classList.contains('hidden')){if(e.key==='Escape')settleClean();return;}
  if(!$('#box').classList.contains('hidden')){if(e.key==='Escape')closeBox();return;}
  if(!$('#att').classList.contains('hidden')){if(e.key==='Escape')closeAtt();return;}
  if(!$('#draw').classList.contains('hidden')){if(e.key==='Escape')closeDraw();else if((e.key===' '||e.key==='Enter')&&!e.target.matches('input,textarea,select,button')){e.preventDefault();doDraw();}return;}
  if($('#overlay').classList.contains('show')){if(e.key==='Escape'||e.key==='Enter'){e.preventDefault();closeModal();}return;}
  if(e.target.matches('input,textarea,select'))return;
  if((e.ctrlKey||e.metaKey)&&(e.key==='z'||e.key==='Z')){e.preventDefault();undo();return;}
  if(view!=='class')return;
  if(e.key==='f'||e.key==='F'){document.body.classList.contains('present')?exitPresent():enterPresent();return;}
  if(/^[0-9]$/.test(e.key)){buf=(buf+e.key).slice(-2);showBuf();}
  else if(e.key==='Enter'&&buf){const n=parseInt(buf);buf='';showBuf();mark(n);}
  else if(e.key==='Backspace'){buf=buf.slice(0,-1);showBuf();}
  else if(e.key==='Escape'){buf='';showBuf();}
});

updateToday();setInterval(updateToday,60000);
setInterval(()=>{
  const now=Date.now();
  S.classes.forEach(c=>{if(c.session){processRecovery(c,now);processIntervals(c,now);}});
  updateTimer();
},1000);

renderAll();
})();
